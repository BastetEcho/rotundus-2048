<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotundus 2048</title>
  <style>
    :root {
      --paper: #faf8ef;
      --ink: #3d372f;
      --muted: #776e65;
      --board: #bbada0;
      --empty: #cdc1b4;
      --button: #8f7a66;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .app {
      width: min(94vw, 680px);
      margin: 0 auto;
      padding: 20px 0 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(42px, 10vw, 72px);
      line-height: 0.95;
    }

    .scores { display: flex; gap: 8px; }

    .score-box {
      min-width: 78px;
      border-radius: 6px;
      background: var(--board);
      color: white;
      padding: 8px 10px;
      text-align: center;
      font-weight: 700;
    }

    .score-box span {
      display: block;
      color: #eee4da;
      font-size: 12px;
      text-transform: uppercase;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0 16px;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: var(--button);
      color: #f9f6f2;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      min-height: 42px;
      padding: 8px 10px;
    }

    button:hover { filter: brightness(1.05); }

    .board-wrap {
      position: relative;
      width: min(94vw, 620px);
      aspect-ratio: 1;
      margin: 0 auto;
      touch-action: none;
    }

    svg { width: 100%; height: 100%; display: block; }

    .cell-path {
      stroke: #bbada0;
      stroke-width: 4;
      transition: fill 120ms ease;
    }

    .tile-label {
      pointer-events: none;
      fill: #776e65;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
      font-size: 22px;
    }

    .seam-line {
      stroke: #3d372f;
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0.65;
      pointer-events: none;
    }

    .seam-handle {
      fill: #3d372f;
      stroke: #faf8ef;
      stroke-width: 5;
      cursor: grab;
    }

    .message {
      min-height: 30px;
      margin-top: 12px;
      color: var(--ink);
      font-weight: 700;
      text-align: center;
    }

    .hint {
      margin: 10px auto 0;
      max-width: 560px;
      text-align: center;
      font-size: 15px;
      line-height: 1.35;
    }

    @media (max-width: 540px) {
      .topbar { align-items: stretch; flex-direction: column; }
      .scores { justify-content: space-between; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile-label { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>Rotundus 2048</h1>
      <div class="scores">
        <div class="score-box"><span>Score</span><strong id="score">0</strong></div>
        <div class="score-box"><span>Best</span><strong id="best">0</strong></div>
      </div>
    </div>

    <div class="controls" aria-label="Game controls">
      <button id="counterButton" type="button">Counterclockwise</button>
      <button id="clockButton" type="button">Clockwise</button>
      <button id="undoButton" type="button">Undo</button>
      <button id="newButton" type="button">New Game</button>
    </div>

    <section class="board-wrap" id="boardWrap" aria-label="Rotundus 2048 board">
      <svg id="board" viewBox="0 0 600 600" role="img" aria-label="Round 2048 board"></svg>
    </section>

    <div class="message" id="message"></div>
    <p class="hint">Drag the center handle to move the cut line. Use Left/Right or A/D for counterclockwise and clockwise moves.</p>
  </main>

  <script>
    (() => {
      const size = 4;
      const center = 300;
      const outerRadius = 280;
      const innerRadius = 34;
      const ringWidth = (outerRadius - innerRadius) / size;
      const board = document.getElementById('board');
      const boardWrap = document.getElementById('boardWrap');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const messageEl = document.getElementById('message');
      const colors = {
        0: ['#cdc1b4', '#776e65'],
        2: ['#eee4da', '#776e65'],
        4: ['#ede0c8', '#776e65'],
        8: ['#f2b179', '#f9f6f2'],
        16: ['#f59563', '#f9f6f2'],
        32: ['#f67c5f', '#f9f6f2'],
        64: ['#f65e3b', '#f9f6f2'],
        128: ['#edcf72', '#f9f6f2'],
        256: ['#edcc61', '#f9f6f2'],
        512: ['#edc850', '#f9f6f2'],
        1024: ['#edc53f', '#f9f6f2'],
        2048: ['#edc22e', '#f9f6f2']
      };

      const rings = buildRings();
      let grid = emptyGrid();
      let score = 0;
      let best = Number(localStorage.getItem('rotundusBest') || 0);
      let seamAngle = -135;
      let previous = null;
      let draggingSeam = false;
      let swipeStart = null;

      function emptyGrid() {
        return Array.from({ length: size }, () => Array(size).fill(0));
      }

      function buildRings() {
        const output = [];
        for (let radius = 0; radius < size; radius += 1) {
          const ring = [];
          for (let y = radius; y >= 0; y -= 1) ring.push([size - 1 - y, radius]);
          for (let x = radius - 1; x >= 0; x -= 1) ring.push([size - 1 - radius, x]);
          output.push(ring);
        }
        return output;
      }

      function cloneGrid(source) {
        return source.map((row) => row.slice());
      }

      function polarPoint(radius, angleDegrees) {
        const radians = (angleDegrees - 90) * Math.PI / 180;
        return [center + radius * Math.cos(radians), center + radius * Math.sin(radians)];
      }

      function describeArc(inner, outer, startAngle, endAngle) {
        const largeArc = endAngle - startAngle > 180 ? 1 : 0;
        const outerStart = polarPoint(outer, startAngle);
        const outerEnd = polarPoint(outer, endAngle);
        const innerEnd = polarPoint(inner, endAngle);
        const innerStart = polarPoint(inner, startAngle);
        return [
          `M ${outerStart[0]} ${outerStart[1]}`,
          `A ${outer} ${outer} 0 ${largeArc} 1 ${outerEnd[0]} ${outerEnd[1]}`,
          `L ${innerEnd[0]} ${innerEnd[1]}`,
          `A ${inner} ${inner} 0 ${largeArc} 0 ${innerStart[0]} ${innerStart[1]}`,
          'Z'
        ].join(' ');
      }

      function lineValues(cells) {
        return cells.map(([row, col]) => grid[row][col]);
      }

      function writeLine(cells, values) {
        cells.forEach(([row, col], index) => {
          grid[row][col] = values[index];
        });
      }

      function mergeLine(values) {
        const packed = values.filter(Boolean);
        const merged = [];
        let gained = 0;
        for (let i = 0; i < packed.length; i += 1) {
          if (packed[i] === packed[i + 1]) {
            const value = packed[i] * 2;
            merged.push(value);
            gained += value;
            i += 1;
          } else {
            merged.push(packed[i]);
          }
        }
        while (merged.length < values.length) merged.push(0);
        return { values: merged, gained };
      }

      function rotatedRing(ring) {
        if (ring.length === 1) return ring;
        const normalized = ((seamAngle % 360) + 360) % 360;
        const offset = Math.round((normalized / 360) * ring.length) % ring.length;
        return ring.slice(offset).concat(ring.slice(0, offset));
      }

      function moveAround(clockwise) {
        const before = JSON.stringify(grid);
        previous = { grid: cloneGrid(grid), score };
        let gained = 0;
        rings.forEach((ring) => {
          const cells = rotatedRing(ring);
          const ordered = clockwise ? cells.slice().reverse() : cells;
          const result = mergeLine(lineValues(ordered));
          gained += result.gained;
          writeLine(ordered, result.values);
        });
        if (JSON.stringify(grid) === before) {
          previous = null;
          return false;
        }
        score += gained;
        addRandomTile();
        render();
        checkGameState();
        return true;
      }

      function addRandomTile() {
        const empty = [];
        grid.forEach((row, rowIndex) => {
          row.forEach((value, colIndex) => {
            if (!value) empty.push([rowIndex, colIndex]);
          });
        });
        if (!empty.length) return;
        const [row, col] = empty[Math.floor(Math.random() * empty.length)];
        grid[row][col] = Math.random() < 0.9 ? 2 : 4;
      }

      function hasRoundMove() {
        return rings.some((ring) => {
          const cells = rotatedRing(ring);
          const forward = lineValues(cells);
          const backward = lineValues(cells.slice().reverse());
          return JSON.stringify(mergeLine(forward).values) !== JSON.stringify(forward) ||
            JSON.stringify(mergeLine(backward).values) !== JSON.stringify(backward);
        });
      }

      function checkGameState() {
        if (grid.some((row) => row.includes(2048))) {
          messageEl.textContent = 'You made 2048. Keep spinning if you want.';
        } else if (!grid.some((row) => row.includes(0)) && !hasRoundMove()) {
          messageEl.textContent = 'Game over.';
        } else {
          messageEl.textContent = '';
        }
      }

      function updateScore() {
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem('rotundusBest', String(best));
        }
        bestEl.textContent = best;
      }

      function render() {
        board.innerHTML = '';
        updateScore();
        rings.forEach((ring, ringIndex) => {
          const inner = ringIndex === 0 ? 0 : innerRadius + ringWidth * (ringIndex - 1);
          const outer = innerRadius + ringWidth * ringIndex;
          const segment = 360 / ring.length;
          rotatedRing(ring).forEach(([row, col], index) => {
            const start = seamAngle + index * segment;
            const end = start + segment;
            const value = grid[row][col];
            const [fill, labelColor] = colors[value] || ['#3c3a32', '#f9f6f2'];
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('class', 'cell-path');
            path.setAttribute('fill', fill);
            path.setAttribute('d', ringIndex === 0 ? centerDiscPath(outer) : describeArc(inner, outer, start, end));
            board.appendChild(path);
            if (value) addLabel(value, labelColor, ringIndex, start + segment / 2, inner, outer);
          });
        });
        drawSeam();
      }

      function centerDiscPath(radius) {
        return `M ${center - radius} ${center} a ${radius} ${radius} 0 1 0 ${radius * 2} 0 a ${radius} ${radius} 0 1 0 ${-radius * 2} 0`;
      }

      function addLabel(value, color, ringIndex, angle, inner, outer) {
        const radius = ringIndex === 0 ? outer / 2 : (inner + outer) / 2;
        const [x, y] = polarPoint(radius, angle);
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('class', 'tile-label');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('fill', color);
        text.textContent = value;
        board.appendChild(text);
      }

      function drawSeam() {
        const start = polarPoint(12, seamAngle);
        const end = polarPoint(outerRadius + 8, seamAngle);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', 'seam-line');
        line.setAttribute('x1', start[0]);
        line.setAttribute('y1', start[1]);
        line.setAttribute('x2', end[0]);
        line.setAttribute('y2', end[1]);
        board.appendChild(line);

        const handle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        handle.setAttribute('class', 'seam-handle');
        handle.setAttribute('cx', end[0]);
        handle.setAttribute('cy', end[1]);
        handle.setAttribute('r', 15);
        board.appendChild(handle);
      }

      function angleFromEvent(event) {
        const rect = board.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 600 - center;
        const y = ((event.clientY - rect.top) / rect.height) * 600 - center;
        return Math.atan2(y, x) * 180 / Math.PI + 90;
      }

      function newGame() {
        grid = emptyGrid();
        score = 0;
        previous = null;
        messageEl.textContent = '';
        addRandomTile();
        addRandomTile();
        render();
      }

      function undo() {
        if (!previous) return;
        grid = cloneGrid(previous.grid);
        score = previous.score;
        previous = null;
        messageEl.textContent = '';
        render();
      }

      function pointerDown(event) {
        const angle = angleFromEvent(event);
        const distance = Math.hypot(event.offsetX - board.clientWidth / 2, event.offsetY - board.clientHeight / 2);
        swipeStart = { x: event.clientX, y: event.clientY };
        draggingSeam = distance > board.clientWidth * 0.38;
        if (draggingSeam) {
          seamAngle = angle;
          render();
        }
      }

      function pointerMove(event) {
        if (!draggingSeam) return;
        seamAngle = angleFromEvent(event);
        render();
      }

      function pointerUp(event) {
        if (draggingSeam) {
          draggingSeam = false;
          return;
        }
        if (!swipeStart) return;
        const dx = event.clientX - swipeStart.x;
        const dy = event.clientY - swipeStart.y;
        if (Math.hypot(dx, dy) < 35) return;
        const rect = boardWrap.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const startAngle = Math.atan2(swipeStart.y - centerY, swipeStart.x - centerX);
        const endAngle = Math.atan2(event.clientY - centerY, event.clientX - centerX);
        moveAround(endAngle > startAngle);
      }

      document.getElementById('counterButton').addEventListener('click', () => moveAround(false));
      document.getElementById('clockButton').addEventListener('click', () => moveAround(true));
      document.getElementById('undoButton').addEventListener('click', undo);
      document.getElementById('newButton').addEventListener('click', newGame);
      boardWrap.addEventListener('pointerdown', pointerDown);
      boardWrap.addEventListener('pointermove', pointerMove);
      boardWrap.addEventListener('pointerup', pointerUp);
      boardWrap.addEventListener('pointercancel', () => { draggingSeam = false; swipeStart = null; });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') moveAround(false);
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') moveAround(true);
        if (event.key.toLowerCase() === 'u') undo();
        if (event.key.toLowerCase() === 'n') newGame();
      });

      newGame();
    })();
  </script>
</body>
</html>
